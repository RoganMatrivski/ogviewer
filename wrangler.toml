# For more details on how to configure Wrangler, refer to:
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "ogviewer-v2"
main = ".open-next/worker.js"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[browser]
binding = "BROWSER"


# -----------------------------------------------------------------------------
# Static Assets
# https://developers.cloudflare.com/workers/static-assets/binding/
# -----------------------------------------------------------------------------
[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# -----------------------------------------------------------------------------
# Observability
# -----------------------------------------------------------------------------
[observability]
enabled = true

[dev]
ip = "0.0.0.0"

# -----------------------------------------------------------------------------
# Smart Placement
# Docs: https://developers.cloudflare.com/workers/configuration/smart-placement/#smart-placement
# -----------------------------------------------------------------------------
# [placement]
# mode = "smart"

# -----------------------------------------------------------------------------
# Bindings
# Bindings allow your Worker to interact with resources on the Cloudflare Developer Platform,
# including databases, object storage, AI inference, real-time communication and more.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Environment Variables
# https://developers.cloudflare.com/workers/wrangler/configuration/#environment-variables
# -----------------------------------------------------------------------------
# [vars]
# MY_VARIABLE = "production_value"
#
# Note: Use secrets to store sensitive data.
# https://developers.cloudflare.com/workers/configuration/secrets/

# -----------------------------------------------------------------------------
# Static Assets (alternative example)
# https://developers.cloudflare.com/workers/static-assets/binding/
# -----------------------------------------------------------------------------
# [assets]
# directory = "./public/"
# binding = "ASSETS"

# -----------------------------------------------------------------------------
# Service Bindings
# Communicate between multiple Workers
# https://developers.cloudflare.com/workers/wrangler/configuration/#service-bindings
# -----------------------------------------------------------------------------
# [[services]]
# binding = "MY_SERVICE"
# service = "my-service"
